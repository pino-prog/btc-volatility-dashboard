name: Fetch Intel Feed

on:
  schedule:
    - cron: '0 */6 * * *'   # 6시간마다 (00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch:          # 수동 실행 가능

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch feed data
        run: node scripts/fetch-feed.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed-data.json
          git diff --staged --quiet || git commit -m "chore: update intel feed [skip ci]"
          git push
