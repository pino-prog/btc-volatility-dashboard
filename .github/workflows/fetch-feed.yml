name: Fetch Intel Feed & Macro Events

on:
  schedule:
    - cron: '0 */6 * * *'   # 6시간마다 (00:00, 06:00, 12:00, 18:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch intel feed (nitter/RSSHub)
        run: node scripts/fetch-feed.mjs

      - name: Fetch macro events (멀티소스 크로스체크)
        run: node scripts/fetch-macro-events.mjs
        env:
          AV_API_KEY: ${{ secrets.AV_API_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed-data.json macro-events.json
          git diff --staged --quiet || git commit -m "chore: update feed + macro events [skip ci]"
          git push
